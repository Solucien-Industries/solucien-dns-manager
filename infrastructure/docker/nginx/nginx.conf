# Reverse proxy: /api -> NestJS API, everything else -> Next.js web app.
# Enabled with: docker compose --profile edge up

upstream sdm_api {
  server api:4000;
}

# When running the web app in a container, point this at it. For local dev the
# web app runs on the host, reachable via host.docker.internal.
upstream sdm_web {
  server host.docker.internal:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://sdm_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://sdm_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
