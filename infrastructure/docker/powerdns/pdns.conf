# PowerDNS Authoritative configuration (local dev)
# Backend: PostgreSQL (gpgsql) — shares the postgres service, separate `pdns` database.

launch=gpgsql
gpgsql-host=postgres
gpgsql-port=5432
gpgsql-dbname=pdns
gpgsql-user=sdm
gpgsql-password=sdm
gpgsql-dnssec=yes

# REST API + built-in webserver
api=yes
api-key=1132d3c60d9af09306782c5329856db2350ce9cced371ebe
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

# Listen on all interfaces inside the container
local-address=0.0.0.0
local-port=53
loglevel=4
